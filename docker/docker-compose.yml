# Compose paths (env_file, .env interpolation) resolve from this folder (`docker/`).
#
# Recommended:
#   cd docker && cp .env.example .env && docker compose up --build
#
# From repo root:
#   cp docker/.env.example docker/.env
#   docker compose --project-directory docker -f docker/docker-compose.yml --env-file docker/.env up --build

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: uom-sqlserver
    env_file:
      - path: .env
        required: false
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - uom-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: uom-web
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=sqlserver,1433;Database=UOM;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;Encrypt=False
      Database__AutoMigrate: "true"
    ports:
      - "8080:8080"

volumes:
  uom-sql-data: